  <main id="main" class="main">
    <div class="wrap">
      <h1 class="page-title">Name the work you already run. Field School writes back.</h1>
      <section class="card card-note">
        <form method="post" action="mailto:ben@fieldschool.ai" enctype="text/plain">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="run">What you run</label>
            <textarea id="run" name="run" required></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Send this.</button>
        </form>
      </section>
    </div>
