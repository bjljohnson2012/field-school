name: field-school

services:
  campus-db:
    image: pgvector/pgvector:pg16
    container_name: field-school-campus-db
    restart: unless-stopped
    command: postgres -c shared_buffers=256MB
    env_file:
      - /opt/field-school.env
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${CAMPUS_POSTGRES_PASSWORD}
      POSTGRES_DB: campus
    volumes:
      - /opt/field-school/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - campus

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: field-school-app
    restart: unless-stopped
    depends_on:
      campus-db:
        condition: service_healthy
    env_file:
      - /opt/field-school.env
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      MEMBER_STORE_PATH: /app/data/campus-store.json
      DATABASE_URL: postgres://campus:${CAMPUS_POSTGRES_PASSWORD}@campus-db:5432/campus
      COMPOSER_UPLOAD_ROOT: /opt/field-school/uploads
    expose:
      - "3000"
    volumes:
      - field-school-data:/app/data
      - /opt/field-school/uploads:/opt/field-school/uploads
      - /opt/field-school-plates/plates:/plates
    networks:
      - proxy
      - campus

  # Coaching cron. Profile coaching-cron is off. `docker compose up` does not
  # create this container. Do not set CRON_SECRET here. Do not enable the profile
  # from deploy. One POST per hour to the app container on the campus network.
  coaching-cron:
    image: alpine:3.20
    container_name: field-school-coaching-cron
    profiles:
      - coaching-cron
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    networks:
      - campus
    command: >
      sh -c "
        apk add --no-cache curl > /dev/null;
        while true; do
          echo \"[cron] $$(date -u +%Y-%m-%dT%H:%M:%SZ) POST /api/cron/coaching\";
          curl -sS -X POST \
            -H \"Authorization: Bearer $$CRON_SECRET\" \
            http://field-school-app:3000/api/cron/coaching || echo \"[cron] coaching failed\";
          echo;
          sleep 3600;
        done
      "

volumes:
  field-school-data:

networks:
  campus:
  proxy:
    name: ae-coach_default
    external: true

