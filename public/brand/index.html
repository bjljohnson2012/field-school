<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field School logos</title>
  <link rel="icon" href="/brand/icon-color.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --cream:#f6f3ec; --ink:#1a1916; --blue:#1f5eff; --border:#d8d2c6; }
    body { margin:0; background:var(--cream); color:var(--ink); font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif; }
    main { width:min(1100px, calc(100% - 2rem)); margin:0 auto; padding:3rem 0 5rem; }
    h1 { font-family:Fraunces,Georgia,serif; font-size:clamp(2rem,5vw,3rem); letter-spacing:-0.03em; margin:0 0 0.5rem; }
    .lede { color:#5c5850; max-width:40rem; }
    h2 { font-family:Fraunces,Georgia,serif; font-size:1.4rem; margin:2.5rem 0 1rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; }
    .grid.wide { grid-template-columns:1fr; }
    figure { margin:0; }
    .frame { border:1px solid var(--border); border-radius:12px; min-height:140px; display:grid; place-items:center; padding:1.25rem; }
    .frame img { max-width:100%; max-height:120px; height:auto; }
        .wide .frame img { max-height:420px; }
    figcaption { margin-top:0.5rem; font-size:0.85rem; color:#5c5850; }
    code { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:0.8rem; }
    a { color:var(--blue); }
  </style>
</head>
<body>
  <main>
    <p><a href="/">Field School</a></p>
    <h1>Logos</h1>
    <p class="lede">The mark is the blue field note. The name is Field School. Use the square icon for apps and avatars, the wide lockup for headers and mail, and the banners for social. Files live in <code>/brand</code>.</p>
    <h2>SVG</h2>
    <div class="grid"><figure><div class="frame" style="background:#f6f3ec"><img src="mark-color.svg" alt="Mark, color, transparent"></div><figcaption>Mark, color, transparent</figcaption></figure><figure><div class="frame" style="background:#f6f3ec"><img src="mark-black.svg" alt="Mark, black, transparent"></div><figcaption>Mark, black, transparent</figcaption></figure><figure><div class="frame" style="background:#1f5eff"><img src="mark-white.svg" alt="Mark, white, on blue"></div><figcaption>Mark, white, on blue</figcaption></figure><figure><div class="frame" style="background:#f6f3ec"><img src="icon-color.svg" alt="Square icon, cream"></div><figcaption>Square icon, cream</figcaption></figure><figure><div class="frame" style="background:#f6f3ec"><img src="icon-blue.svg" alt="Square icon, blue"></div><figcaption>Square icon, blue</figcaption></figure><figure><div class="frame" style="background:#f6f3ec"><img src="icon-ink.svg" alt="Square icon, ink"></div><figcaption>Square icon, ink</figcaption></figure><figure><div class="frame" style="background:#f6f3ec"><img src="lockup-wide-color.svg" alt="Wide lockup, color"></div><figcaption>Wide lockup, color</figcaption></figure><figure><div class="frame" style="background:#f6f3ec"><img src="lockup-wide-black.svg" alt="Wide lockup, black"></div><figcaption>Wide lockup, black</figcaption></figure><figure><div class="frame" style="background:#1a1916"><img src="lockup-wide-white.svg" alt="Wide lockup, white"></div><figcaption>Wide lockup, white</figcaption></figure><figure><div class="frame" style="background:#f6f3ec"><img src="lockup-stacked-color.svg" alt="Stacked lockup, color"></div><figcaption>Stacked lockup, color</figcaption></figure><figure><div class="frame" style="background:#f6f3ec"><img src="wordmark-color.svg" alt="Wordmark"></div><figcaption>Wordmark</figcaption></figure><figure><div class="frame" style="background:#f6f3ec"><img src="slogan-color.svg" alt="Slogan"></div><figcaption>Slogan</figcaption></figure><figure><div class="frame" style="background:#f6f3ec"><img src="lockup-wide-slogan.svg" alt="Wide lockup with slogan"></div><figcaption>Wide lockup with slogan</figcaption></figure><figure><div class="frame" style="background:#f6f3ec"><img src="social-avatar.svg" alt="Social avatar"></div><figcaption>Social avatar</figcaption></figure></div>
    <h2>PNG</h2>
    <div class="grid wide"><figure class="wide"><div class="frame"><img src="png/lockup-wide-slogan-cream.png" alt="Wide lockup with slogan"></div><figcaption>Wide lockup with slogan</figcaption></figure><figure class="wide"><div class="frame"><img src="png/lockup-stacked-slogan-cream.png" alt="Stacked lockup with slogan"></div><figcaption>Stacked lockup with slogan</figcaption></figure><figure class="wide"><div class="frame"><img src="png/social-square-color.png" alt="Social square 2048"></div><figcaption>Social square 2048</figcaption></figure><figure class="wide"><div class="frame"><img src="png/social-avatar-blue-2048.png" alt="Social avatar, blue 2048"></div><figcaption>Social avatar, blue 2048</figcaption></figure><figure class="wide"><div class="frame"><img src="png/og-2400x1260.png" alt="Open Graph 2400x1260"></div><figcaption>Open Graph 2400x1260</figcaption></figure><figure class="wide"><div class="frame"><img src="png/x-banner-3000x1000.png" alt="X / LinkedIn banner"></div><figcaption>X / LinkedIn banner</figcaption></figure><figure class="wide"><div class="frame"><img src="png/email-lockup.png" alt="Email lockup"></div><figcaption>Email lockup</figcaption></figure><figure class="wide"><div class="frame"><img src="png/cover-3840x2160.png" alt="Cover 3840x2160"></div><figcaption>Cover 3840x2160</figcaption></figure></div>
  </main>
</body>
</html>
