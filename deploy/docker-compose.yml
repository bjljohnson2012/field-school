name: field-school

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: field-school-app
    restart: unless-stopped
    env_file:
      - /opt/field-school.env
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - proxy

networks:
  proxy:
    name: ae-coach_default
    external: true
