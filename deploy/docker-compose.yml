name: field-school

services:
  db:
    image: postgres:16-alpine
    container_name: field-school-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldschool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fieldschool
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldschool -d fieldschool"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: field-school-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fieldschool:${POSTGRES_PASSWORD}@db:5432/fieldschool
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://university.benjohnson.ai}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-https://university.benjohnson.ai,https://srv1643164.hstgr.cloud}
      DEAN_EMAILS: ${DEAN_EMAILS:-bjljohnson2012@gmail.com}
      XAI_API_KEY: ${XAI_API_KEY:-}
      PORT: "3000"
      HOST: 0.0.0.0
    expose:
      - "3000"
    networks:
      - internal
      - proxy

volumes:
  pgdata:

networks:
  internal:
  proxy:
    name: ae-coach_default
    external: true
